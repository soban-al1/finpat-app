  <path d="M618 234 Q628 228 638 234" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M662 234 Q672 228 682 234" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round"/>

