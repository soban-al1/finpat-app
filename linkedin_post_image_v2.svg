  <path d="M588 228 Q600 170 650 168 Q700 170 712 228 Q700 200 650 198 Q600 200 588 228 Z" fill="#1e1b4b"/>
  <path d="M608 200 Q615 185 630 182" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

