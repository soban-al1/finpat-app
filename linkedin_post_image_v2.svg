    <line x1="-14" y1="0" x2="14" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(1050, 200)">
