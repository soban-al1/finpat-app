<svg viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <filter id="blobShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#sky)"/>

  <path d="M0 520 Q200 490 400 520 Q600 550 800 515 Q1000 480 1200 510 L1200 627 L0 627 Z" fill="#fde68a" opacity="0.5"/>
  <path d="M0 545 Q300 510 600 545 Q900 580 1200 545 L1200 627 L0 627 Z" fill="#fbbf24" opacity="0.35"/>

  <ellipse cx="820" cy="340" rx="320" ry="260" fill="#fb923c" opacity="0.12" filter="url(#blobShadow)"/>

  <circle cx="60" cy="60" r="12" fill="#f87171" opacity="0.5"/>
  <circle cx="120" cy="40" r="7" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1140" cy="80" r="14" fill="#34d399" opacity="0.5"/>
  <circle cx="1100" cy="130" r="8" fill="#818cf8" opacity="0.6"/>
