  <circle cx="628" cy="248" r="11" fill="#ffffff"/>
  <circle cx="672" cy="248" r="11" fill="#ffffff"/>
  <circle cx="631" cy="250" r="7" fill="#1e1b4b"/>
  <circle cx="675" cy="250" r="7" fill="#1e1b4b"/>
  <circle cx="634" cy="247" r="2.5" fill="#ffffff"/>
  <circle cx="678" cy="247" r="2.5" fill="#ffffff"/>

