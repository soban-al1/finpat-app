  <circle cx="578" cy="252" r="7" fill="#818cf8"/>
  <circle cx="722" cy="252" r="7" fill="#818cf8"/>

  <!-- Text -->
  <text x="340" y="175" font-family="'Inter','Helvetica Neue',sans-serif" font-size="54" font-weight="900" fill="#1e1b4b" text-anchor="middle">The most exciting</text>
  <text x="340" y="240" font-family="'Inter','Helvetica Neue',sans-serif" font-size="54" font-weight="900" fill="#1e1b4b" text-anchor="middle">time to build. 🔥</text>

  <rect x="140" y="268" width="400" height="44" rx="22" fill="#6366f1"/>
  <text x="340" y="296" font-family="'Inter','Helvetica Neue',sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">One person. Every role. Real product.</text>

  <rect x="140" y="330" width="110" height="30" rx="15" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="195" y="349" font-family="'Inter','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">#BuildInPublic</text>

  <rect x="262" y="330" width="88" height="30" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="306" y="349" font-family="'Inter','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">#ProductLed</text>

  <rect x="362" y="330" width="80" height="30" rx="15" fill="#ede9fe" stroke="#818cf8" stroke-width="1.5"/>
  <text x="402" y="349" font-family="'Inter','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">#ShipFast</text>

  <text x="340" y="420" font-family="'Inter','Helvetica Neue',sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Sharing the journey — the decisions, the</text>
  <text x="340" y="442" font-family="'Inter','Helvetica Neue',sans-serif" font-size="16" fill="#64748b" text-anchor="middle">learnings, and the honest mistakes.</text>

  <text x="600" y="598" font-family="'Inter','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle" opacity="0.7">finpat.app</text>
