    <rect x="796" y="308" width="60" height="6" rx="3" fill="#818cf8" opacity="0.7"/>
    <rect x="796" y="320" width="90" height="4" rx="2" fill="#4f46e5" opacity="0.5"/>
    <rect x="796" y="330" width="75" height="4" rx="2" fill="#4f46e5" opacity="0.5"/>
    <rect x="796" y="346" width="40" height="14" rx="4" fill="#34d399" opacity="0.8"/>
