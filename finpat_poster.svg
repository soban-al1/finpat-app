<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#0B1828"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#6366f1"/>
      <stop offset="70%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="260" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Wordmark -->
  <text x="540" y="174"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="110" font-weight="900"
    fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">FinPat</text>

  <!-- Indigo → gold rule -->
  <rect x="200" y="196" width="680" height="2" rx="1" fill="url(#rule)"/>

  <!-- Tagline -->
  <text x="540" y="242"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="22" font-weight="400"
    fill="#64748b" text-anchor="middle">Built for the ones who carry both worlds.</text>

  <!-- Arc — Work to Home -->
  <path d="M 260,600 Q 540,360 820,600"
    stroke="url(#arc)" stroke-width="2" fill="none"
    stroke-linecap="round"/>

  <!-- Left node — Work -->
  <circle cx="260" cy="600" r="46" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="260" cy="600" r="30" fill="#6366f1"/>
  <circle cx="260" cy="600" r="8"  fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Right node — Home -->
  <circle cx="820" cy="600" r="46" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="820" cy="600" r="30" fill="#f59e0b"/>
  <circle cx="820" cy="600" r="8"  fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Node labels -->
  <text x="260" y="662"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="700"
    fill="#6366f1" text-anchor="middle" letter-spacing="3">WORK</text>

  <text x="820" y="662"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="700"
    fill="#f59e0b" text-anchor="middle" letter-spacing="3">HOME</text>

  <!-- Feature line -->
  <text x="540" y="776"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="17" font-weight="500"
    fill="#64748b" text-anchor="middle" letter-spacing="0.5">Obligations  ·  Remittances  ·  Savings</text>

  <!-- Footer separator -->
  <rect x="180" y="824" width="720" height="1" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Domain -->
  <text x="540" y="870"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="700"
    fill="#FFFFFF" fill-opacity="0.45"
    text-anchor="middle" letter-spacing="4">FINPAT.APP</text>

  <!-- Platform -->
  <text x="540" y="902"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="13" font-weight="400"
    fill="#334155" text-anchor="middle">Available on Android  ·  iOS Coming Soon</text>

</svg>
